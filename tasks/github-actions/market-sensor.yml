# task_id: market-sensor
# version: 0.3.0
# platform: github-actions
# role_spec: docs/03-market-sensor.md
# implementation_spec: docs/market-v1-requirements.md
# updated_at: 2026-10-20
# Active configuration: .github/workflows/market-sensor.yml; keep both copies in sync.
name: Market Sensor

on:
  schedule:
    - cron: '17 20 * * 1-5'
      timezone: Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: Demo or historical trial monitoring
        type: choice
        options: [demo, history]
        default: demo
        required: true
      source:
        description: Data source (fixture is always synthetic)
        type: choice
        options: [fixture, tushare]
        default: fixture
        required: true
      as_of_date:
        description: History only - YYYYMMDD (blank means today in Asia/Taipei)
        type: string
        default: ''
      trade_date:
        description: Demo Tushare only - YYYYMMDD
        type: string
        default: ''
      ts_code:
        description: Demo Tushare only - single instrument
        type: string
        default: ''
      demo_abs_pct:
        description: Demo only - threshold in percent
        type: string
        default: '5'
        required: true

permissions:
  contents: read

jobs:
  sense:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline behavior
        run: python3 -m unittest discover -s scripts/market -p 'test_*.py' -v
      - name: Fetch and evaluate selected mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_AS_OF_DATE: ${{ inputs.as_of_date }}
          INPUT_TRADE_DATE: ${{ inputs.trade_date }}
          INPUT_TS_CODE: ${{ inputs.ts_code }}
          INPUT_DEMO_ABS_PCT: ${{ inputs.demo_abs_pct }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python3 scripts/market/actions_entry.py
      - name: Save JSON and Chinese Markdown (including sensor errors)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/market/report.json
            outputs/market/report.md
          if-no-files-found: error
          retention-days: 14
