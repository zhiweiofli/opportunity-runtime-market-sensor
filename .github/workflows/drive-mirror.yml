name: Drive one-way mirror
on:
  schedule:
    - cron: '27 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  id-token: write
concurrency:
  group: drive-one-way-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.DRIVE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: auth
        name: Authenticate as read-only Drive service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Scan and mirror Drive
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: python scripts/workflow/drive_mirror.py
      - id: commit
        name: Commit changed mirror
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- drive-mirror/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Drive mirror'
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh Pages after successful scan
        if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run judge-pages.yml --ref "$DEFAULT_BRANCH"
