name: Opportunity protocol checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
  push:
    branches: [main]
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: opportunity-protocol-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted validation dependencies
        run: python -m pip install -r requirements-workflow.txt
      - name: Validate proposal data and GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_HUMAN_LOGIN: ${{ vars.WORKFLOW_HUMAN_LOGIN }}
        run: python scripts/workflow/validate_pr.py
      - name: Refresh dashboard metadata
        if: ${{ always() && vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run judge-pages.yml --ref "$DEFAULT_BRANCH"
