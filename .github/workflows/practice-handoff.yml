name: Practice task reconciliation
on:
  push:
    branches: [main]
    paths: ['practice/**', 'opportunities/**']
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: write
  statuses: read
concurrency:
  group: practice-task-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-workflow.txt
      - name: Reconcile task issues and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_CONSUMER_LOGIN: ${{ vars.WORKFLOW_CONSUMER_LOGIN }}
          WORKFLOW_SYNTHETIC_CONSUMER_LOGIN: ${{ vars.WORKFLOW_SYNTHETIC_CONSUMER_LOGIN }}
          WORKFLOW_HUMAN_LOGIN: ${{ vars.WORKFLOW_HUMAN_LOGIN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/workflow/issue_handoff.py
      - name: Refresh dashboard metadata
        if: ${{ always() && vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run judge-pages.yml --ref "$DEFAULT_BRANCH"
