name: Judge Dashboard (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/workflow/**'
      - 'schemas/workflow/**'
      - 'requirements-workflow.txt'
      - 'practice/**'
      - 'opportunities/**'
      - 'or-archive/**'
      - 'drive-mirror/**'
      - '.github/workflows/judge-pages.yml'
  schedule:
    - cron: '53 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
        with:
          python-version: '3.11'
      - name: Index mirrored research and Judge documents
        run: python scripts/workflow/build_archive_index.py
      - name: Build dashboard brief
        run: python scripts/workflow/build_brief.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v4
