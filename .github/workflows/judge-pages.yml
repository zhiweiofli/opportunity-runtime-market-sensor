name: Judge Dashboard (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/workflow/**'
      - 'schemas/workflow/**'
      - 'requirements-workflow.txt'
      - 'practice/**'
      - 'opportunities/**'
      - 'or-archive/**'
      - '.github/workflows/judge-pages.yml'
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
        with:
          python-version: '3.11'
      - name: Install snapshot dependency
        if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
        run: python -m pip install -r requirements-workflow.txt
      - name: Generate sanitized workflow snapshot
        if: vars.WORKFLOW_PUBLIC_PROJECTION_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HUMAN_LOGIN: ${{ vars.WORKFLOW_HUMAN_LOGIN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/workflow/build_snapshot.py --output site/data/workflow.json
      - name: Index mirrored research and Judge documents
        run: python scripts/workflow/build_archive_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v4
